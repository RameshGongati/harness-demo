pipeline:
  identifier: petcliniccipipeline
  name: petclinic-ci-pipeline
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.Githubharnessconnector
        repoName: harness-demo
        build:
          type: branch
          spec:
            branch: main
  stages:
    - stage:
        identifier: Build
        type: CI
        name: Build
        description: ""
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: minikubeclusterconnector
              namespace: harness-build
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  identifier: Maven_Package
                  type: Run
                  name: Maven Package
                  spec:
                    connectorRef: account.dockerhubconnector
                    image: maven:3.9-eclipse-temurin-17
                    shell: Sh
                    command: cd app && mvn clean package -DskipTests
              - step:
                  identifier: Build_and_Push_to_DockerHub
                  type: BuildAndPushDockerRegistry
                  name: Build and Push to DockerHub
                  spec:
                    connectorRef: account.dockerhubconnector
                    repo: rameshgongati/petclinic
                    tags:
                      - <+pipeline.sequenceId>
                    dockerfile: app/Dockerfile
                    context: app
                    resources:
                      limits:
                        memory: 2Gi
